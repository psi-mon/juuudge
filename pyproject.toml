[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "juuudge"
version = "0.1.0"
description = "MTG Rules Judge CLI and TUI Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.85.0",
    "anthropic>=0.40.0",
    "lancedb>=0.17.0",
    "fastembed>=0.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "click>=8.1.0",
    "rich>=13.9.0",
    "rapidfuzz>=3.10.0",
]

[project.scripts]
juuudge = "juuudge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
